<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR TRICK スタッフ画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182848; --ink-soft:#2b3b63;
    --coral:#FF6A55; --coral-deep:#E5503C;
    --teal:#2CB6AD; --marigold:#FFC24B;
    --cloud:#FBFAF6; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--ink);
    font-family:"Noto Sans JP", sans-serif;
    color:var(--white);
    padding:28px 16px;
  }
  .page{width:100%; max-width:480px; margin:0 auto;}
  .brand{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-weight:900; font-size:1.3rem;
    text-align:center; margin-bottom:4px;
  }
  .brand span{color:var(--coral);}
  .sub{text-align:center; font-size:0.82rem; opacity:0.65; margin-bottom:26px;}

  .no-key{
    background:rgba(255,106,85,0.15); border:1px solid var(--coral);
    border-radius:16px; padding:18px; text-align:center; font-size:0.9rem; line-height:1.7;
  }

  .scan-box{
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.16);
    border-radius:20px;
    padding:24px;
  }
  input{
    width:100%; padding:16px; font-size:1.1rem;
    border-radius:14px; border:none;
    text-align:center; font-family:"M PLUS Rounded 1c", sans-serif; font-weight:800;
    letter-spacing:0.05em;
  }
  input:focus{outline:3px solid var(--teal);}
  .scan-hint{text-align:center; font-size:0.78rem; opacity:0.6; margin-top:10px;}

  .result{
    margin-top:18px;
    border-radius:16px;
    padding:16px 18px;
    font-weight:700;
    display:none;
  }
  .result.ok{background:rgba(44,182,173,0.18); border:1px solid var(--teal);}
  .result.warn{background:rgba(255,194,75,0.18); border:1px solid var(--marigold);}
  .result.error{background:rgba(255,106,85,0.18); border:1px solid var(--coral);}

  .list-title{
    margin:30px 0 10px;
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-size:0.95rem;
    display:flex; justify-content:space-between; align-items:center;
  }
  .list-title .count{
    background:var(--coral);
    color:var(--white);
    border-radius:999px;
    padding:3px 12px;
    font-size:0.85rem;
  }
  .checkin-list{list-style:none; margin:0; padding:0;}
  .checkin-list li{
    background:rgba(255,255,255,0.05);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:8px;
    font-size:0.92rem;
    display:flex; justify-content:space-between;
  }
  .checkin-list li .time{opacity:0.5; font-size:0.8rem;}
</style>
</head>
<body>

<div class="page">
  <div class="brand">AIR TRICK<span>.</span></div>
  <div class="sub">スタッフ用チェックイン画面</div>

  <div id="noKeyView" class="no-key" style="display:none;">
    URLに合言葉（?key=…）が付いていません。<br>正しいスタッフ用URLからアクセスしてください。
  </div>

  <div id="scanView">
    <div class="scan-box">
      <input id="scanInput" type="text" placeholder="QRコードを読み取る" autofocus>
      <div class="scan-hint">バーコードリーダーで読み取るか、手入力してEnterを押してください</div>
      <div class="result" id="resultBox"></div>
    </div>

    <div class="list-title">
      <span>本日の初回対応</span>
      <span class="count" id="countBadge">0名</span>
    </div>
    <ul class="checkin-list" id="checkinList"></ul>
  </div>
</div>

<script>
// GAS ウェブアプリの /exec URL（Code.gs をデプロイし直しても、URLは変わらない）
const API_URL = 'https://script.google.com/macros/s/AKfycbxGU-KunzSyHMgM4YL8rbKmU0nit10N-o8W7OtT3ncyLA8xu4pv355S-6BvPLBMRoBC/exec';

const params = new URLSearchParams(window.location.search);
const STAFF_KEY_CLIENT = params.get('key') || '';

const input = document.getElementById('scanInput');
const resultBox = document.getElementById('resultBox');
const list = document.getElementById('checkinList');
const countBadge = document.getElementById('countBadge');
let count = 0;

if (!STAFF_KEY_CLIENT) {
  document.getElementById('noKeyView').style.display = 'block';
  document.getElementById('scanView').style.display = 'none';
} else {
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      const value = input.value.trim();
      input.value = '';
      if (!value) return;
      handleScan(value);
    }
  });

  // スキャナーがフォーカスを外してしまった場合に備え、常に入力欄へフォーカスを戻す
  document.addEventListener('click', function () {
    input.focus();
  });
  setInterval(function () {
    if (document.activeElement !== input) input.focus();
  }, 2000);
}

function handleScan(personId) {
  fetch(API_URL, {
    method: 'POST',
    // Content-Type は text/plain にすること（プリフライトを避けるため。GAS側でJSONとしてパースする）
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'checkInPerson',
      staffKey: STAFF_KEY_CLIENT,
      payload: { personId: personId }
    })
  })
    .then(function (res) { return res.json(); })
    .then(function (res) {
      if (!res.ok) {
        throw new Error(res.error || '読み取りに失敗しました');
      }
      if (res.alreadyDone) {
        showResult('warn', res.name + '様は対応済みです（重複読み取り）');
      } else {
        showResult('ok', res.name + '様の初回対応が完了しました');
        addToList(res.name);
      }
    })
    .catch(function (err) {
      showResult('error', err.message || '読み取りに失敗しました');
    });
}

function showResult(type, message) {
  resultBox.className = 'result ' + type;
  resultBox.textContent = message;
  resultBox.style.display = 'block';
}

function addToList(name) {
  count++;
  countBadge.textContent = count + '名';
  const li = document.createElement('li');
  const now = new Date();
  const timeStr = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
  li.innerHTML = '<span>' + escapeHtml(name) + '様</span><span class="time">' + timeStr + '</span>';
  list.insertBefore(li, list.firstChild);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
