<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AIR TRICK スタッフ画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182848; --ink-soft:#2b3b63;
    --coral:#FF6A55; --coral-deep:#E5503C;
    --teal:#2CB6AD; --teal-deep:#1f8f88; --marigold:#FFC24B;
    --cloud:#FBFAF6; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:#EAF4FB;
    font-family:"Noto Sans JP", sans-serif;
    color:var(--ink);
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(rgba(255,255,255,0.84), rgba(255,255,255,0.84)),
      url('assets/sky.jpg') center/cover no-repeat;
  }
  .site-header{
    position:sticky; top:0; z-index:20;
    background:var(--white); padding:8px 16px;
    box-shadow:0 2px 14px rgba(24,40,72,0.10);
    display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .site-header img{display:block; height:48px; width:auto;}
  .site-header .tag{
    font-family:"M PLUS Rounded 1c", sans-serif; font-weight:900; font-size:0.78rem;
    background:var(--ink); color:var(--white); border-radius:999px; padding:4px 12px;
  }
  .page{width:100%; max-width:520px; margin:0 auto; padding:8px 16px 60px;}

  .no-key{
    background:var(--white); border:2px solid var(--coral); border-radius:16px;
    margin-top:18px; padding:18px; text-align:center; font-size:0.9rem; line-height:1.8;
  }

  .scan-box{
    background:var(--white); border-radius:20px; padding:22px 20px; margin-top:18px;
    box-shadow:0 12px 26px rgba(24,40,72,0.08);
  }
  .scan-title{font-family:"M PLUS Rounded 1c", sans-serif; font-weight:900; font-size:0.98rem; margin:0 0 12px; text-align:center;}
  input{
    width:100%; padding:16px; font-size:1.05rem;
    border-radius:14px; border:3px solid var(--ink);
    text-align:center; font-family:"M PLUS Rounded 1c", sans-serif; font-weight:800;
    letter-spacing:0.03em; background:var(--cloud); color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 4px rgba(44,182,173,0.25);}
  .scan-hint{text-align:center; font-size:0.78rem; color:var(--ink-soft); margin-top:10px; line-height:1.7;}
  .nb{display:inline-block;}

  .result{margin-top:18px; border-radius:16px; padding:16px 18px; display:none;}
  .result.ok{background:#E3F6F4; border:2px solid var(--teal);}
  .result.warn{background:#FFF3CD; border:2px solid var(--marigold);}
  .result.error{background:#FFE5E0; border:2px solid var(--coral);}
  .result .rtotal{font-family:"M PLUS Rounded 1c", sans-serif; font-weight:900; font-size:1.15rem;}
  .result .rline{font-size:0.9rem; margin-top:6px; line-height:1.8;}
  .result .rline .first{color:#9A5B12; font-weight:800;}

  .list-sub{font-size:0.78rem; color:var(--ink-soft); margin:-4px 0 10px;}
  .list-title{
    margin:28px 0 10px;
    font-family:"M PLUS Rounded 1c", sans-serif; font-weight:900;
    font-size:0.95rem;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .list-title .count{
    background:var(--coral); color:var(--white);
    border-radius:999px; padding:3px 14px; font-size:0.85rem; white-space:nowrap;
  }
  .checkin-list{list-style:none; margin:0; padding:0;}
  .checkin-list li{
    background:var(--white); border-radius:12px; padding:12px 16px; margin-bottom:8px;
    font-size:0.92rem; font-weight:700;
    display:flex; justify-content:space-between; gap:10px;
    box-shadow:0 4px 12px rgba(24,40,72,0.06);
  }
  .checkin-list li .time{color:var(--ink-soft); font-weight:400; font-size:0.8rem;}

  .nav-links{display:flex; gap:12px; margin-top:28px;}
  .nav-btn{
    flex:1; text-align:center; padding:14px 8px; border-radius:14px; border:3px solid var(--ink);
    background:linear-gradient(135deg, var(--marigold), var(--coral)); box-shadow:4px 4px 0 var(--ink); color:var(--ink);
    font-family:"M PLUS Rounded 1c", sans-serif; font-weight:900; font-size:0.92rem; text-decoration:none; white-space:nowrap;
  }
  .nav-btn.alt{background:var(--white); border-color:var(--teal); box-shadow:4px 4px 0 var(--teal); color:var(--teal-deep);}
</style>
</head>
<body>

<header class="site-header">
  <img src="assets/logo.jpg" alt="トランポリンパーク AIR TRICK（エアトリ）">
  <span class="tag">スタッフ用</span>
</header>

<div class="page">

  <div id="noKeyView" class="no-key" style="display:none;">
    URLに合言葉（?key=…）が付いていません。<br>正しいスタッフ用URLからアクセスしてください。
  </div>

  <div id="scanView">
    <div class="scan-box">
      <h1 class="scan-title">入場QRの読み取り（予備）</h1>
      <input id="scanInput" type="text" placeholder="入場QRを読み取る" autofocus>
      <div class="scan-hint"><span class="nb">バーコードリーダーで読み取るか、</span><span class="nb">手入力してEnterを押してください</span></div>
      <div class="result" id="resultBox"></div>
    </div>

    <div class="list-title">
      <span>本日の初回対応</span>
      <span class="count" id="countBadge">0名</span>
    </div>
    <div class="list-sub">登録料が必要な方の一覧です</div>
    <ul class="checkin-list" id="checkinList"></ul>

    <div class="nav-links">
      <a class="nav-btn" id="statsLink" href="stats.html">集計を見る</a>
      <a class="nav-btn alt" id="guideLink" href="staff-guide.html">操作ガイド</a>
    </div>
  </div>
</div>

<script>
// GAS ウェブアプリの /exec URL（Code.gs をデプロイし直しても、URLは変わらない）
const API_URL = 'https://script.google.com/macros/s/AKfycbxGU-KunzSyHMgM4YL8rbKmU0nit10N-o8W7OtT3ncyLA8xu4pv355S-6BvPLBMRoBC/exec';

const params = new URLSearchParams(window.location.search);
const STAFF_KEY_CLIENT = params.get('key') || '';

const input = document.getElementById('scanInput');
const resultBox = document.getElementById('resultBox');
const list = document.getElementById('checkinList');
const countBadge = document.getElementById('countBadge');
let count = 0;

if (!STAFF_KEY_CLIENT) {
  document.getElementById('noKeyView').style.display = 'block';
  document.getElementById('scanView').style.display = 'none';
} else {
  // 集計画面・操作ガイドへは、合言葉を引き継いで移動する
  document.getElementById('statsLink').href = 'stats.html?key=' + encodeURIComponent(STAFF_KEY_CLIENT);
  document.getElementById('guideLink').href = 'staff-guide.html?key=' + encodeURIComponent(STAFF_KEY_CLIENT);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      const value = input.value.trim();
      input.value = '';
      if (!value) return;
      handleScan(value);
    }
  });

  document.addEventListener('click', function () {
    input.focus();
  });
  setInterval(function () {
    if (document.activeElement !== input) input.focus();
  }, 2000);
}

// 入場QRの中身は、今日の入場者の本人IDをカンマ区切りにしたもの（1人だけのことも、複数人のこともある）。
function handleScan(rawValue) {
  const personIds = rawValue.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (personIds.length === 0) return;

  fetch(API_URL, {
    method: 'POST',
    // Content-Type は text/plain にすること（プリフライトを避けるため。GAS側でJSONとしてパースする）
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'recordGroupVisit',
      staffKey: STAFF_KEY_CLIENT,
      payload: { personIds: personIds }
    })
  })
    .then(function (res) { return res.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || '読み取りに失敗しました');
      showGroupResult(res.result);
    })
    .catch(function (err) {
      showResult('error', '<div class="rline">' + escapeHtml(err.message || '読み取りに失敗しました') + '</div>');
    });
}

function showGroupResult(result) {
  const firstTimers = result.members.filter(function (m) { return m.isFirstVisit; });
  const type = firstTimers.length > 0 ? 'warn' : 'ok';

  const breakdown = Object.keys(result.byCategory).map(function (cat) {
    const c = result.byCategory[cat];
    let line = escapeHtml(cat) + ' ' + c.count + '名';
    if (c.firstTimeCount > 0) {
      line += '<span class="first">（うち初回 ' + c.firstTimeCount + '名）</span>';
    }
    return line;
  }).join('<br>');

  let html = '<div class="rtotal">' + result.total + '名 ご来店</div><div class="rline">' + breakdown + '</div>';
  if (firstTimers.length > 0) {
    html += '<div class="rline">初回の方（登録料500円）：' + firstTimers.map(function (m) { return escapeHtml(m.name); }).join('・') + '様</div>';
  }
  const dups = result.members.filter(function (m) { return m.duplicate; });
  if (dups.length > 0) {
    html += '<div class="rline"><span class="first">4時間以内に記録済み（来店回数は増えません）：</span>' +
      dups.map(function (m) { return escapeHtml(m.name); }).join('・') + '様</div>';
  }
  showResult(type, html);

  // 記録済みの再読み取りは、初回一覧に二重に載せない
  firstTimers.filter(function (m) { return !m.duplicate; }).forEach(function (m) { addToList(m.name); });
}

function showResult(type, html) {
  resultBox.className = 'result ' + type;
  resultBox.innerHTML = html;
  resultBox.style.display = 'block';
}

function addToList(name) {
  count++;
  countBadge.textContent = count + '名';
  const li = document.createElement('li');
  const now = new Date();
  const timeStr = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
  li.innerHTML = '<span>' + escapeHtml(name) + '様</span><span class="time">' + timeStr + '</span>';
  list.insertBefore(li, list.firstChild);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
