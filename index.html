<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR TRICK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182848; --ink-soft:#2b3b63;
    --coral:#FF6A55; --coral-deep:#E5503C;
    --teal:#2CB6AD; --marigold:#FFC24B;
    --cloud:#FBFAF6; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cloud);
    font-family:"Noto Sans JP", sans-serif;
    color:var(--ink);
  }
  .hero{
    padding:56px 16px 64px;
    text-align:center;
    background:
      radial-gradient(120% 90% at 85% 0%, rgba(255,194,75,0.30), transparent 55%),
      radial-gradient(120% 90% at 10% 100%, rgba(44,182,173,0.25), transparent 55%),
      var(--cloud);
  }
  .brand{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-weight:900; font-size:2rem;
  }
  .brand span{color:var(--coral-deep);}
  .catch{
    margin:10px auto 0; max-width:420px;
    font-size:1rem; color:var(--ink-soft); line-height:1.8;
  }
  .cta-row{
    display:flex; flex-direction:column; gap:12px; align-items:center;
    margin-top:28px;
  }
  .cta{
    display:inline-block; width:100%; max-width:280px; padding:16px 40px;
    border-radius:999px; text-decoration:none;
    font-family:"M PLUS Rounded 1c", sans-serif; font-weight:800; font-size:1.05rem;
  }
  .cta.primary{
    background:var(--coral); color:var(--white);
    box-shadow:0 10px 20px rgba(255,106,85,0.32);
  }
  .cta.secondary{
    background:var(--white); color:var(--teal); border:2px solid var(--teal);
  }
  .section{
    max-width:560px; margin:0 auto; padding:40px 20px;
  }
  .section h2{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-size:1.1rem; text-align:center; margin:0 0 28px;
  }
  .steps{display:flex; flex-direction:column; gap:16px;}
  .step{
    background:var(--white); border-radius:18px; padding:20px;
    box-shadow:0 10px 24px rgba(24,40,72,0.08);
    display:flex; gap:16px; align-items:flex-start;
  }
  .step .num{
    flex:none; width:36px; height:36px; border-radius:50%;
    background:var(--teal); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:"M PLUS Rounded 1c", sans-serif; font-weight:800;
  }
  .step .body h3{margin:0 0 4px; font-size:0.98rem;}
  .step .body p{margin:0; font-size:0.85rem; color:var(--ink-soft); line-height:1.7;}

  footer{
    text-align:center; padding:24px; font-size:0.75rem; color:var(--ink-soft);
  }
</style>
</head>
<body>

<div class="hero">
  <div class="brand">AIR TRICK<span>.</span></div>
  <p class="catch">トランポリンパーク AIR TRICK<br>会員登録はスマホから、その場で完結します。</p>
  <div class="cta-row">
    <a class="cta primary" href="register.html">はじめての方はこちら（新規会員登録）</a>
    <a class="cta secondary" href="login.html">会員の方はこちら（ログイン）</a>
  </div>
</div>

<div class="section">
  <h2>ご利用の流れ</h2>
  <div class="steps">
    <div class="step">
      <div class="num">1</div>
      <div class="body">
        <h3>会員登録</h3>
        <p>お名前・フリガナ・電話番号・生年月日を入力するだけ。同行者もまとめて登録できます。</p>
      </div>
    </div>
    <div class="step">
      <div class="num">2</div>
      <div class="body">
        <h3>マイページで今日の入場者を選ぶ</h3>
        <p>来店時にマイページを開き、今日一緒に来る方を選んで入場QRを発行します。</p>
      </div>
    </div>
    <div class="step">
      <div class="num">3</div>
      <div class="body">
        <h3>QRコードをスタッフに提示</h3>
        <p>発行されたQRコードをスタッフにご提示いただくだけで、人数分まとめて受付が完了します。</p>
      </div>
    </div>
  </div>
</div>

<footer>&copy; AIR TRICK</footer>

</body>
</html>
