<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR TRICK チェックイン</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#182848; --ink-soft:#2b3b63; --coral-deep:#E5503C; --teal-deep:#1f8f88; --white:#FFFFFF; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:#EAF4FB; font-family:"Noto Sans JP", sans-serif; color:var(--ink);}
  body::before{
    content:''; position:fixed; inset:0; z-index:-1;
    background:linear-gradient(rgba(255,255,255,0.84), rgba(255,255,255,0.84)), url('assets/sky.jpg') center/cover no-repeat;
  }
  .site-header{background:var(--white); padding:8px 16px; box-shadow:0 2px 14px rgba(24,40,72,0.10);}
  .site-header img{display:block; height:48px; width:auto; margin:0 auto;}
  .page{width:100%; max-width:480px; margin:0 auto; padding:8px 16px 60px;}
  .card{background:var(--white); border-radius:20px; padding:28px 22px; margin-top:18px; box-shadow:0 12px 26px rgba(24,40,72,0.08); text-align:center; line-height:1.9;}
  .nb{display:inline-block;}
  .card h1{font-family:"M PLUS Rounded 1c", sans-serif; font-size:1.1rem; margin:0 0 10px;}
  .btn{
    display:block; margin-top:18px; padding:14px 18px; border-radius:14px; border:3px solid var(--ink);
    background:linear-gradient(135deg, #FFC24B, #FF6A55); color:var(--ink); box-shadow:4px 4px 0 var(--ink);
    font-family:"M PLUS Rounded 1c", sans-serif; font-weight:900; text-decoration:none;
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html"><img src="assets/logo.jpg" alt="トランポリンパーク AIR TRICK（エアトリ）"></a>
</header>

<div class="page">
  <div class="card" id="msg">
    <h1>チェックイン</h1>
    <p>読み込み中…</p>
  </div>
</div>

<script>
// スマホ標準のカメラで「チェックインQR」を読み取ったときに開くページ。
// ログイン済みなら、そのままマイページ（チェックイン画面）へ進む。
(function () {
  var key = new URLSearchParams(window.location.search).get('s');
  var pid = '';
  try { pid = localStorage.getItem('airtrick_pid') || ''; } catch (e) {}
  var box = document.getElementById('msg');

  if (key && pid) {
    window.location.replace('mypage.html?id=' + encodeURIComponent(pid) + '&checkin=' + encodeURIComponent(key));
    return;
  }

  if (!key) {
    box.innerHTML = '<h1>チェックイン</h1><p><span class="nb">お店のチェックインQRを</span><span class="nb">読み取ってください。</span></p>' +
      '<a class="btn" href="login.html">会員の方はこちら</a>';
    return;
  }

  box.innerHTML = '<h1>ログインが必要です</h1>' +
    '<p>ログインしたあと、マイページの<br>「チェックインQRを読み取る」ボタンから<br>もう一度レジ横のQRを読み取ってください。</p>' +
    '<a class="btn" href="login.html">ログインする</a>' +
    '<a class="btn" href="register.html" style="background:#fff; box-shadow:4px 4px 0 var(--teal-deep); border-color:var(--teal-deep); color:var(--teal-deep);">はじめての方はこちら</a>';
})();
</script>

</body>
</html>
