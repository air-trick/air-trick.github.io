<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR TRICK ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182848; --ink-soft:#2b3b63;
    --coral:#FF6A55; --coral-deep:#E5503C;
    --teal:#2CB6AD; --teal-deep:#1f8f88; --marigold:#FFC24B;
    --cloud:#FBFAF6; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:#EAF4FB;
    font-family:"Noto Sans JP", sans-serif;
    color:var(--ink);
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(rgba(255,255,255,0.84), rgba(255,255,255,0.84)),
      url('assets/sky.jpg') center/cover no-repeat;
  }
  .site-header{
    position:sticky; top:0; z-index:20;
    background:var(--white); padding:8px 16px;
    box-shadow:0 2px 14px rgba(24,40,72,0.10);
  }
  .site-header a{display:block;}
  .site-header img{display:block; height:48px; width:auto; margin:0 auto;}
  .wrap{padding:28px 16px 56px;}

  .card{
    width:100%; max-width:480px; margin:0 auto;
    background:var(--white);
    border-radius:24px;
    padding:32px 28px;
    box-shadow:0 20px 40px rgba(24,40,72,0.12);
  }
  h1{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-size:1.15rem; text-align:center;
    margin:0 0 26px; color:var(--ink-soft); font-weight:700;
  }
  label{display:block;font-weight:700;font-size:0.88rem;margin:14px 0 6px;}
  input{
    width:100%; padding:12px 14px;
    border-radius:12px; border:2px solid #E7E3D9;
    font-size:1rem; font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--teal);}

  /* バッジ風ボタン（トップページと共通） */
  .btn-badge{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; padding:14px 20px;
    border-radius:14px; border:3px solid var(--ink);
    background:linear-gradient(135deg, var(--marigold), var(--coral));
    color:var(--ink); box-shadow:5px 5px 0 var(--ink);
    font-family:"M PLUS Rounded 1c", sans-serif; font-weight:900; font-size:1.02rem; letter-spacing:0.02em;
    cursor:pointer; text-decoration:none;
    transition:transform .08s, box-shadow .08s;
  }
  .btn-badge:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink);}
  .btn-badge:disabled{opacity:0.6; cursor:default;}
  .btn-badge.dark{background:var(--ink); color:var(--white); border-color:var(--marigold); box-shadow:5px 5px 0 var(--marigold);}
  .btn-badge.dark:active{box-shadow:2px 2px 0 var(--marigold);}
  button.login{margin-top:26px;}

  .error{margin-top:14px;color:var(--coral-deep);font-size:0.88rem;display:none;}
  .note{margin-top:20px;font-size:0.82rem;color:var(--ink-soft);text-align:center;line-height:1.7;}
  .note a{color:var(--coral-deep);font-weight:700;}

  .saved-box{
    background:var(--cloud); border-radius:16px; padding:18px; margin-bottom:22px;
    text-align:center;
  }
  .saved-box p{margin:0 0 14px; font-size:0.9rem; color:var(--ink-soft);}
  .saved-box .name{font-weight:800; color:var(--ink);}
  .divider{
    display:flex; align-items:center; gap:10px; margin:22px 0;
    font-size:0.78rem; color:var(--ink-soft);
  }
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:#E7E3D9;}
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html"><img src="assets/logo.jpg" alt="トランポリンパーク AIR TRICK（エアトリ）"></a>
</header>

<div class="wrap">
<div class="card">
  <h1>マイページにログイン</h1>

  <div id="savedBox" class="saved-box" style="display:none;">
    <p>前回このスマホでログインした<br><span class="name" id="savedName"></span> のマイページがあります</p>
    <button class="btn-badge dark" id="savedBtn">このままマイページを開く</button>
  </div>

  <div id="switchDivider" class="divider" style="display:none;">別の人としてログイン</div>

  <div id="formView">
    <label for="kana">フリガナ</label>
    <input id="kana" type="text" placeholder="ヤマグチ ハナコ">
    <label for="birthdate">生年月日</label>
    <input id="birthdate" type="date">

    <div id="phoneRow" style="display:none;">
      <label for="phone">電話番号</label>
      <input id="phone" type="tel" placeholder="09012345678">
      <p class="note" style="margin-top:6px;">同じフリガナ・生年月日の方が複数いたため、ご登録の電話番号で確認します。</p>
    </div>

    <button class="btn-badge login" id="loginBtn">ログイン</button>
    <div class="error" id="errorMsg"></div>
    <p class="note">まだ会員登録がお済みでない方は<br><a href="register.html">こちらから新規登録</a></p>
  </div>
</div>
</div>

<script>
// GAS ウェブアプリの /exec URL（Code.gs をデプロイし直しても、URLは変わらない）
const API_URL = 'https://script.google.com/macros/s/AKfycbxGU-KunzSyHMgM4YL8rbKmU0nit10N-o8W7OtT3ncyLA8xu4pv355S-6BvPLBMRoBC/exec';
const STORAGE_KEY = 'airtrick_personId';
const STORAGE_NAME_KEY = 'airtrick_personName';

const kanaEl = document.getElementById('kana');
const birthdateEl = document.getElementById('birthdate');
const phoneRow = document.getElementById('phoneRow');
const phoneEl = document.getElementById('phone');
const loginBtn = document.getElementById('loginBtn');
const errorEl = document.getElementById('errorMsg');

// 前回ログインした端末なら、ワンタップで開けるようにする
(function () {
  let savedId, savedName;
  try {
    savedId = localStorage.getItem(STORAGE_KEY);
    savedName = localStorage.getItem(STORAGE_NAME_KEY);
  } catch (e) { /* プライベートブラウズ等では無視 */ }

  if (savedId) {
    document.getElementById('savedBox').style.display = 'block';
    document.getElementById('switchDivider').style.display = 'flex';
    document.getElementById('savedName').textContent = savedName || '会員';
    document.getElementById('savedBtn').addEventListener('click', function () {
      location.href = 'mypage.html?id=' + encodeURIComponent(savedId);
    });
  }
})();

let ambiguous = false;

loginBtn.addEventListener('click', function () {
  const kana = kanaEl.value.trim();
  const birthdate = birthdateEl.value;
  const phone = phoneEl.value.trim();

  errorEl.style.display = 'none';

  if (!kana || !birthdate) {
    errorEl.textContent = 'フリガナと生年月日を入力してください。';
    errorEl.style.display = 'block';
    return;
  }
  if (ambiguous && !phone) {
    errorEl.textContent = '電話番号を入力してください。';
    errorEl.style.display = 'block';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'ログイン中…';

  let url = API_URL + '?action=login&kana=' + encodeURIComponent(kana) + '&birthdate=' + encodeURIComponent(birthdate);
  if (phone) url += '&phone=' + encodeURIComponent(phone);

  fetch(url)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      loginBtn.disabled = false;
      loginBtn.textContent = 'ログイン';

      if (!data.ok) throw new Error(data.error || 'ログインに失敗しました。');

      const result = data.result;
      if (result.status === 'found') {
        try {
          localStorage.setItem(STORAGE_KEY, result.personId);
          localStorage.setItem(STORAGE_NAME_KEY, kana);
        } catch (e) { /* 保存できなくても続行 */ }
        location.href = 'mypage.html?id=' + encodeURIComponent(result.personId);
        return;
      }
      if (result.status === 'ambiguous') {
        ambiguous = true;
        phoneRow.style.display = 'block';
        errorEl.textContent = '同じフリガナ・生年月日の方が複数いました。電話番号もご入力ください。';
        errorEl.style.display = 'block';
        return;
      }
      // not_found
      errorEl.textContent = '該当する会員情報が見つかりませんでした。フリガナ・生年月日をご確認いただくか、新規登録をお願いします。';
      errorEl.style.display = 'block';
    })
    .catch(function (err) {
      loginBtn.disabled = false;
      loginBtn.textContent = 'ログイン';
      errorEl.textContent = err.message || 'ログインに失敗しました。時間をおいて再度お試しください。';
      errorEl.style.display = 'block';
    });
});
</script>

<script src="assets/phrase.js"></script>
</body>
</html>
